<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5000 5500" role="img" aria-labelledby="title desc">
  <title id="title">C.R.E.A.M. — Context Rules Everything Around Me</title>
  <desc id="desc">Stacked bold acronym with a one-line expansion underneath.</desc>
  <defs>
    <style>
      .stack {
        font-family: "Bebas Neue", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        text-anchor: middle;
        letter-spacing: 60px;
      }
      .stack-fill { fill: #15120f; }
      .accent { fill: #c43e2a; }
      .expand {
        font-family: "Iowan Old Style", Georgia, serif;
        font-style: italic;
        text-anchor: middle;
        fill: #15120f;
      }
    </style>
  </defs>
  <g transform="translate(2500 2200)">
    <text class="stack stack-fill" y="0" font-size="900">C.</text>
    <text class="stack accent" y="780" font-size="900">R.</text>
    <text class="stack stack-fill" y="1560" font-size="900">E.A.M.</text>
  </g>
  <g transform="translate(2500 4600)">
    <text class="expand" font-size="200">context rules everything around me</text>
  </g>
</svg>
