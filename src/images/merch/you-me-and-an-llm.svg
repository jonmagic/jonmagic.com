<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5000 5500" role="img" aria-labelledby="title desc">
  <title id="title">You, me, and an LLM</title>
  <desc id="desc">Three stacked subjects with em-style separators on a clean shirt face.</desc>
  <defs>
    <style>
      .line {
        font-family: "Bebas Neue", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        text-anchor: middle;
        letter-spacing: 12px;
      }
      .ink { fill: #15120f; }
      .accent { fill: #c43e2a; }
      .rule { stroke: #15120f; stroke-width: 14; }
    </style>
  </defs>
  <g transform="translate(2500 2000)">
    <text class="line ink" y="0" font-size="780">YOU</text>
    <text class="line ink" y="700" font-size="780">+ ME</text>
    <text class="line accent" y="1400" font-size="780">+ AN LLM</text>
  </g>
  <line class="rule" x1="1500" y1="4100" x2="3500" y2="4100"/>
  <text class="line ink" x="2500" y="4400" font-size="180" letter-spacing="20" font-family="SFMono-Regular, Consolas, monospace">jonmagic.com</text>
</svg>
