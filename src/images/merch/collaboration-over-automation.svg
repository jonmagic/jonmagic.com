<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5000 5500" role="img" aria-labelledby="title desc">
  <title id="title">collaboration over automation</title>
  <desc id="desc">A centered, lowercase handwritten phrase for printing in black ink on natural or cream shirts.</desc>

  <defs>
    <style>
      .ink {
        fill: #15120f;
        stroke: #15120f;
        stroke-width: 5;
        paint-order: stroke fill;
        font-family: "Reenie Beanie", "Rock Salt", "Bradley Hand", cursive;
        font-weight: 400;
        text-anchor: middle;
      }
    </style>
  </defs>

  <g id="collaboration-over-automation" transform="translate(2500 2750) rotate(-0.8)">
    <g id="handwritten-phrase">
      <text class="ink" x="-55" y="-560" font-size="820" letter-spacing="-20" rotate="-4 2 -3 1 3 -2 2 -4 3 -1 2 -3 1" transform="rotate(-2.5 -55 -560)">collaboration</text>
      <text class="ink" x="20" y="110" font-size="760" letter-spacing="-12" rotate="2 -4 1 -3" transform="rotate(1.8 20 110)">over</text>
      <text class="ink" x="-35" y="790" font-size="810" letter-spacing="-18" rotate="-3 3 -2 2 -4 1 -2 3 -1 2" transform="rotate(-1.2 -35 790)">automation</text>
    </g>
  </g>
</svg>
